<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GTA 5 RP Калькулятор</title>
    <style>
        body {
            background: #1a1a2e;
            color: white;
            font-family: Arial;
            padding: 20px;
        }
        input, button {
            padding: 10px;
            margin: 5px 0;
            font-size: 16px;
        }
        button {
            background: gold;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            background: #2a2a3e;
            padding: 15px;
        }
    </style>
</head>
<body>
    <h2>💰 GTA 5 RP Калькулятор</h2>
    <p>by Fredorkom</p>

    <label>Цена покупки ($):</label><br>
    <input type="number" id="buy" placeholder="10000"><br>

    <label>Цена продажи ($):</label><br>
    <input type="number" id="sell" placeholder="25000"><br>

    <label>Налог (%):</label><br>
    <input type="number" id="tax" value="10"><br>

    <label>Расходы ($):</label><br>
    <input type="number" id="exp" value="0"><br>

    <button onclick="calc()">Рассчитать</button>

    <div class="result" id="result">Здесь будет результат</div>

    <script>
        function calc() {
            let buy = parseFloat(document.getElementById('buy').value);
            let sell = parseFloat(document.getElementById('sell').value);
            let tax = parseFloat(document.getElementById('tax').value);
            let exp = parseFloat(document.getElementById('exp').value);

            if (isNaN(buy) || isNaN(sell)) {
                document.getElementById('result').innerHTML = "Заполните цену покупки и продажи!";
                return;
            }

            let taxAmount = sell * tax / 100;
            let profit = sell - (buy + taxAmount + exp);
            let roi = (profit / buy) * 100;

            document.getElementById('result').innerHTML = `
                <b>Чистая прибыль:</b> $${profit.toLocaleString()}<br>
                <b>Налог:</b> $${taxAmount.toLocaleString()}<br>
                <b>ROI:</b> ${roi.toFixed(1)}%<br>
                ${profit < 0 ? '⚠️ Убыток!' : (roi < 50 ? '⚠️ Низкая доходность' : '✅ Хорошая сделка!')}
            `;
        }
    </script>
</body>
</html>
