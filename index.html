<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grapeside Калькулятор</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #ffd700;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #2a2a3e;
            border: 1px solid #3a3a4e;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #ffd700;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #ffed4a;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a3e;
            border-radius: 10px;
            text-align: center;
        }
        .profit {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }
        .warning {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
        }
        .good {
            color: #51cf66;
        }
        hr {
            border-color: #3a3a4e;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 GTA 5 RP Калькулятор</h1>
<p style="text-align: center; color: #888; font-size: 12px; margin-top: -10px;">by Fredorkom</p>
        
        <div class="input-group">
            <label>💰 Цена покупки ($)</label>
            <input type="number" id="buyPrice" placeholder="Например: 10000">
        </div>
        
        <div class="input-group">
            <label>💵 Цена продажи ($)</label>
            <input type="number" id="sellPrice" placeholder="Например: 25000">
        </div>
        
        <div class="input-group">
            <label>💸 Налог (%)</label>
            <input type="number" id="tax" placeholder="Например: 10" value="10">
        </div>
        
        <div class="input-group">
            <label>📦 Расходы ($)</label>
            <input type="number" id="expenses" placeholder="Аренда, бензин..." value="0">
        </div>
        
        <button onclick="calculate()">Рассчитать</button>
        
        <div class="result" id="result">
            <div style="color: #ccc;">Введите данные и нажмите «Рассчитать»</div>
        </div>
    </div>

    <script>
        function calculate() {
            let buyPrice = parseFloat(document.getElementById('buyPrice').value);
            let sellPrice = parseFloat(document.getElementById('sellPrice').value);
            let taxPercent = parseFloat(document.getElementById('tax').value);
            let expenses = parseFloat(document.getElementById('expenses').value);
            
            if (isNaN(buyPrice)  isNaN(sellPrice)  isNaN(taxPercent) || isNaN(expenses)) {
                document.getElementById('result').innerHTML = '<div style="color: #ff6b6b;">⚠️ Заполните все поля!</div>';
                return;
            }
            
            let taxAmount = sellPrice * (taxPercent / 100);
            let netProfit = sellPrice - (buyPrice + taxAmount + expenses);
            let roi = (netProfit / buyPrice) * 100;
            
            let warning = '';
            if (netProfit < 0) {warning = '<div class="warning">⚠️ Сделка убыточная! Не продавайте.</div>';
            } else if (roi < 50) {
                warning = '<div class="warning">⚠️ Низкая доходность (менее 50%). Ищите лучший товар.</div>';
            } else {
                warning = '<div class="good">✅ Отличная сделка! Хороший ROI.</div>';
            }
            
            let html = `
                <div class="profit">Чистая прибыль: $${netProfit.toLocaleString()}</div>
                <div>Налог (${taxPercent}%): $${taxAmount.toLocaleString()}</div>
                <div>ROI: ${roi.toFixed(1)}%</div>
                <hr>
                ${warning}
            `;
            
            document.getElementById('result').innerHTML = html;
        }
    </script>
</body>
</html>
